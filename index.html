<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>덕수궁 수학·역사 현장 탐구</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    .slide-curve {
      background: linear-gradient(180deg, #1898b5 0%, #38bdf8 65%, #f8fafc 100%);
      border-radius: 0 0 50% 50% / 0 0 24px 24px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-24">

  <!-- 상단 네비게이션 헤더 -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-2.5 shadow-sm flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="w-7 h-7 rounded-lg bg-teal-600 text-white flex items-center justify-center font-bold text-xs shadow">덕</span>
      <div>
        <h1 class="text-xs font-bold text-slate-900 leading-none">덕수궁 매쓰 투어</h1>
        <span id="navTeamInfo" class="text-[11px] text-teal-700 font-semibold">입장 대기 중</span>
      </div>
    </div>
    <button id="btnOpenReport" onclick="openReportModal()" class="hidden px-2.5 py-1 bg-slate-800 text-white rounded-lg text-xs font-bold shadow hover:bg-slate-900">
      답안 모아보기
    </button>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-md mx-auto p-3 space-y-3">

    <!-- 0. 첫 화면: 조 번호 & 조원 이름 입력 카드 -->
    <section id="loginSection" class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 text-center space-y-4 my-2">
      <div class="w-16 h-16 bg-teal-50 text-teal-600 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold shadow-inner">
        🏛️
      </div>
      <div>
        <h2 class="text-lg font-black text-slate-900">덕수궁 현장 탐구 입장</h2>
        <p class="text-xs text-slate-500 mt-1">우리 조 번호와 함께하는 조원들의 이름을 적어주세요.</p>
      </div>

      <div class="space-y-3 text-left pt-2">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">1. 조 번호 선택</label>
          <select id="inputTeamNum" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-xl p-2.5 font-bold focus:ring-teal-500 focus:border-teal-500">
            <option value="1조">1조</option>
            <option value="2조">2조</option>
            <option value="3조">3조</option>
            <option value="4조">4조</option>
            <option value="5조">5조</option>
            <option value="6조">6조</option>
            <option value="7조">7조</option>
            <option value="8조">8조</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">2. 조원 이름 입력</label>
          <input type="text" id="inputMembers" placeholder="예: 김민수, 이서연, 박준호" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-xl p-2.5 focus:ring-teal-500 focus:border-teal-500">
        </div>

        <button type="button" onclick="handleStartTour()" class="w-full mt-2 py-3.5 bg-teal-600 hover:bg-teal-700 active:scale-98 text-white rounded-2xl font-bold text-sm shadow-md transition flex items-center justify-center space-x-1">
          <span>미션 시작하기 (입장)</span>
          <span>➔</span>
        </button>
      </div>
    </section>

    <!-- 1~10번 슬라이드 미션 카드 영역 -->
    <div id="missionDeck" class="hidden space-y-3">
      
      <!-- 1~10번 슬라이드 탭 버튼 바 -->
      <div class="flex items-center space-x-1.5 overflow-x-auto py-1 scrollbar-none" id="tabsWrapper"></div>

      <!-- 슬라이드 본체 카드 -->
      <div class="bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden">
        
        <!-- 슬라이드 상단 곡선 헤더 -->
        <div class="slide-curve pt-4 pb-6 px-4 text-center">
          <h2 id="viewSlideNum" class="text-xl font-black text-slate-900 tracking-wider font-mono drop-shadow-sm">[1번]</h2>
        </div>

        <!-- 슬라이드 사진 박스 -->
        <div class="px-4 -mt-2">
          <div class="w-full aspect-[16/10] bg-slate-200 rounded-2xl overflow-hidden shadow border border-slate-200 flex items-center justify-center">
            <img id="viewSlideImg" src="" alt="슬라이드 사진" class="w-full h-full object-cover">
          </div>
        </div>

        <!-- 슬라이드 지문 및 미션 구역 -->
        <div class="p-4 space-y-3">
          <div id="viewSlideDesc" class="text-xs sm:text-sm font-semibold text-slate-800 leading-relaxed whitespace-pre-line bg-slate-50 p-3.5 rounded-2xl border border-slate-100"></div>

          <!-- 동적 입력 폼 -->
          <div id="viewInteractiveZone" class="pt-2 border-t border-slate-100 space-y-3"></div>

          <!-- 저장 토스트 -->
          <div id="saveToast" class="hidden p-2.5 bg-teal-50 border border-teal-200 text-teal-800 rounded-xl text-xs font-bold text-center">
            ✓ 답안이 실시간 저장되었습니다!
          </div>
        </div>

        <!-- 하단 네비게이션 버튼 -->
        <div class="bg-slate-50 border-t border-slate-200 px-4 py-3 flex items-center justify-between">
          <button onclick="moveSlide(-1)" class="px-3.5 py-2 text-xs font-bold text-slate-600 bg-white border border-slate-300 rounded-xl hover:bg-slate-100 shadow-sm">
            ◀ 이전
          </button>
          <button onclick="saveCurrentData()" class="px-5 py-2 text-xs font-bold text-white bg-teal-600 hover:bg-teal-700 rounded-xl shadow">
            답안 저장
          </button>
          <button onclick="moveSlide(1)" class="px-3.5 py-2 text-xs font-bold text-slate-600 bg-white border border-slate-300 rounded-xl hover:bg-slate-100 shadow-sm">
            다음 ▶
          </button>
        </div>

      </div>

      <!-- 최종 보고서 확인 버튼 -->
      <button onclick="openReportModal()" class="w-full py-3.5 bg-gradient-to-r from-teal-700 via-teal-600 to-slate-800 text-white rounded-2xl font-bold text-sm shadow-md flex items-center justify-center space-x-2">
        <span>모둠 전체 답안 검토 및 선생님께 전송</span>
      </button>

    </div>

  </main>

  <!-- 최종 결과 보고서 모달 -->
  <div id="reportModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 class="font-bold text-sm text-slate-800" id="reportHeaderTitle">탐구 보고서</h3>
        <button onclick="document.getElementById('reportModal').classList.add('hidden')" class="text-slate-400 hover:text-slate-700 text-lg font-bold px-1">✕</button>
      </div>
      <div class="p-4 overflow-y-auto space-y-3 text-xs" id="reportContent"></div>
      <div class="p-3 border-t border-slate-200 bg-slate-50 flex space-x-2">
        <button onclick="copyToClipboard()" class="flex-1 py-2.5 bg-slate-800 text-white rounded-xl text-xs font-bold hover:bg-slate-900 shadow">
          텍스트 복사 (카톡·패들렛 제출)
        </button>
        <button onclick="document.getElementById('reportModal').classList.add('hidden')" class="px-4 py-2.5 bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">
          닫기
        </button>
      </div>
    </div>
  </div>

  <script>
    const SLIDES_DATA = [
      {
        num: 1,
        title: "[1번]",
        img: "https://images.unsplash.com/photo-1598970434795-0c54fe7c0648?w=800&auto=format&fit=crop&q=80",
        desc: "【H】 덕수궁에 들어가려면 정문인 '대한문'을 지나야 합니다. 대한문에는 문이 3개가 있다. 이는 신분에 따라 출입을 달리 하기 위해서입니다. 다음 문은 누가 드나들던 문일까요?",
        render: () => `
          <div class="grid grid-cols-3 gap-2">
            <div class="bg-slate-50 p-2 border border-slate-200 rounded-xl text-center">
              <span class="block text-xs font-bold mb-1 text-slate-700">왼쪽 문</span>
              <select id="ans_1_l" class="w-full text-xs p-1.5 border rounded-lg bg-white">
                <option value="">선택</option>
                <option value="왕(황제)">왕(황제)</option>
                <option value="문관(동반)">문관(동반)</option>
                <option value="무관(서반)">무관(서반)</option>
              </select>
            </div>
            <div class="bg-slate-50 p-2 border border-slate-200 rounded-xl text-center">
              <span class="block text-xs font-bold mb-1 text-slate-700">중간 문</span>
              <select id="ans_1_m" class="w-full text-xs p-1.5 border rounded-lg bg-white">
                <option value="">선택</option>
                <option value="왕(황제)">왕(황제)</option>
                <option value="문관(동반)">문관(동반)</option>
                <option value="무관(서반)">무관(서반)</option>
              </select>
            </div>
            <div class="bg-slate-50 p-2 border border-slate-200 rounded-xl text-center">
              <span class="block text-xs font-bold mb-1 text-slate-700">오른쪽 문</span>
              <select id="ans_1_r" class="w-full text-xs p-1.5 border rounded-lg bg-white">
                <option value="">선택</option>
                <option value="왕(황제)">왕(황제)</option>
                <option value="문관(동반)">문관(동반)</option>
                <option value="무관(서반)">무관(서반)</option>
              </select>
            </div>
          </div>
          <p class="text-[11px] text-slate-400 text-center">💡 팁: 왕이 궁궐 안에서 남쪽을 바라보는 시선 기준</p>
        `
      },
      {
        num: 2,
        title: "[2번]",
        img: "https://images.unsplash.com/photo-1598970434795-0c54fe7c0648?w=800&auto=format&fit=crop&q=80",
        desc: "【M】 문의 폭의 비는 얼마일까요?\n\n• 폭의 비를 측정한 방법을 동영상으로 찍어서 보내주세요.\n• 문의 폭의 비는 얼마인가요?",
        render: () => `
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">문의 폭의 비 (왼쪽 : 중간 : 오른쪽)</label>
              <div class="flex items-center space-x-1">
                <input type="text" id="ans_2_l" placeholder="왼쪽" class="w-1/3 text-center text-xs p-2 border rounded-lg">
                <span>:</span>
                <input type="text" id="ans_2_m" placeholder="중간" class="w-1/3 text-center text-xs p-2 border rounded-lg">
                <span>:</span>
                <input type="text" id="ans_2_r" placeholder="오른쪽" class="w-1/3 text-center text-xs p-2 border rounded-lg">
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">폭의 비를 측정한 방법 설명</label>
              <input type="text" id="ans_2_how" placeholder="예: 신발 길이, 보폭 등으로 측정" class="w-full text-xs p-2 border rounded-lg">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">측정 사진/동영상 첨부</label>
              <input type="file" accept="image/*,video/*" capture="environment" id="ans_2_file" class="text-xs w-full text-slate-500">
            </div>
          </div>
        `
      },
      {
        num: 3,
        title: "[3번]",
        img: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&auto=format&fit=crop&q=80",
        desc: "【H】 함녕전 뒤뜰의 북쪽 방향에 있는 초록색 지붕의 건물로 러시아의 건축가 사바틴이 1900년에 지은 것으로 고종이 세자인 순종과 함께 음악을 듣고 커피를 마신 곳입니다. 이곳을 찾아 모둠끼리 인증샷을 찍어 보내고 이 건물의 이름을 적어 보내주세요.",
        render: () => `
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">이 건물의 이름은?</label>
              <input type="text" id="ans_3_name" placeholder="전각 이름을 입력하세요" class="w-full text-xs p-2.5 border rounded-lg font-bold">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">모둠 현장 인증샷</label>
              <input type="file" accept="image/*" capture="environment" id="ans_3_photo" class="text-xs w-full text-slate-500">
            </div>
          </div>
        `
      },
      {
        num: 4,
        title: "[4번]",
        img: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&auto=format&fit=crop&q=80",
        desc: "【M】 기둥과 철제 난간, 단청의 그림을 잘 관찰하여 봅시다. 여기에는 꽃, 사슴, 박쥐, 소나무 등이 장식되어 있는데 위 그림과 같은 두 기둥 사이에 장식되어 있는 박쥐가 보이나요?\n\n1. 박쥐의 위치를 사진에서 표시해서 이미지로 보내주세요.\n2. 박쥐는 총 몇 마리인가요?",
        render: () => `
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">두 기둥 사이 박쥐의 총 마리 수는?</label>
              <div class="flex items-center space-x-2">
                <input type="number" id="ans_4_count" placeholder="0" class="w-24 text-center text-xs p-2 border rounded-lg font-bold">
                <span class="text-xs font-bold text-slate-600">마리</span>
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">박쥐를 찾은 난간 사진 첨부</label>
              <input type="file" accept="image/*" capture="environment" id="ans_4_photo" class="text-xs w-full text-slate-500">
            </div>
          </div>
        `
      },
      {
        num: 5,
        title: "[5번]",
        img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Korean_Empire_Emblem.svg/640px-Korean_Empire_Emblem.svg.png",
        desc: "【H】 대한제국의 국장으로 일제는 대한제국을 자주 국가가 아니라 천황의 지배를 받는 한 가문으로 낮추기 위해 이 문양을 궁궐 곳곳에 새겨 놓았다고 합니다. 이 문양의 이름은 오얏꽃이라고 합니다.\n\n1. 정관헌, 석조전, 덕홍전의 오얏꽃 문양을 찾아 사진을 찍어 보내 주세요.\n2. 덕홍전 오얏꽃의 색깔은?",
        render: () => `
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">2. 덕홍전 오얏꽃의 색깔은?</label>
              <input type="text" id="ans_5_color" placeholder="예: 황금색, 노란색 등" class="w-full text-xs p-2 border rounded-lg">
            </div>
            <div class="space-y-2">
              <label class="block text-xs font-bold text-slate-700">1. 세 전각의 오얏꽃 문양 사진 첨부</label>
              <div class="space-y-1 text-xs text-slate-600">
                <div>• 정관헌: <input type="file" accept="image/*" id="ans_5_f1" class="text-xs w-full"></div>
                <div>• 석조전: <input type="file" accept="image/*" id="ans_5_f2" class="text-xs w-full"></div>
                <div>• 덕홍전: <input type="file" accept="image/*" id="ans_5_f3" class="text-xs w-full"></div>
              </div>
            </div>
          </div>
        `
      },
      {
        num: 6,
        title: "[6번]",
        img: "https://images.unsplash.com/photo-1548115184-bc6544d06a58?w=800&auto=format&fit=crop&q=80",
        desc: "【M】 한옥에서 칸이란 기둥과 기둥사이의 공간입니다. 기둥이 다섯 개있으면 네 칸이고, 두 개 있으면 한 칸입니다. 사진 속 공간의 크기는 4칸 × 1칸 = 4칸입니다.\n\n1. 보잘 것 없는 작은 집을 초가삼간(草家三間)이라고 하는데 초가삼간은 몇 칸일까요?\n2. 조선시대에는 왕 이외의 사람은 몇 칸을 넘는 집에서 살 수 없게 했답니다. 몇 칸일까요?",
        render: () => `
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">1. 초가삼간은 몇 칸일까요?</label>
              <div class="flex items-center space-x-2">
                <input type="number" id="ans_6_q1" placeholder="칸" class="w-24 text-center text-xs p-2 border rounded-lg font-bold">
                <span class="text-xs font-bold">칸</span>
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">2. 조선시대 일반인이 살 수 있는 최대 칸 수는?</label>
              <div class="flex items-center space-x-2">
                <input type="number" id="ans_6_q2" placeholder="칸" class="w-24 text-center text-xs p-2 border rounded-lg font-bold">
                <span class="text-xs font-bold">칸을 넘을 수 없음</span>
              </div>
            </div>
          </div>
        `
      },
      {
        num: 7,
        title: "[7번]",
        img: "https://images.unsplash.com/photo-1598970434795-0c54fe7c0648?w=800&auto=format&fit=crop&q=80",
        desc: "【M】 한옥에서 칸이란 기둥과 기둥사이의 공간입니다. 기둥이 다섯 개있으면 네 칸이고, 두 개 있으면 한 칸입니다. 사진 속 공간의 크기는 4칸 × 1칸 = 4칸입니다.\n\n3. 중화전과 석어당은 몇 칸일까요?\n4. 조선시대 건축법에 따르면 중화전과 석어당 중 누가 더 넓을까요?",
        render: () => `
          <div class="space-y-3">
            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 space-y-1.5">
              <span class="block text-xs font-bold text-slate-800">• 중화전 (정면 × 측면)</span>
              <div class="flex items-center space-x-1 text-xs">
                <input type="number" id="ans_7_jhw" placeholder="정면" class="w-16 p-1.5 border rounded text-center">
                <span>칸 ×</span>
                <input type="number" id="ans_7_jhh" placeholder="측면" class="w-16 p-1.5 border rounded text-center">
                <span>칸 =</span>
                <input type="number" id="ans_7_jht" placeholder="총" class="w-16 p-1.5 border rounded text-center font-bold text-teal-700">
                <span>칸</span>
              </div>
            </div>
            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 space-y-1.5">
              <span class="block text-xs font-bold text-slate-800">• 석어당 (정면 × 측면)</span>
              <div class="flex items-center space-x-1 text-xs">
                <input type="number" id="ans_7_sew" placeholder="정면" class="w-16 p-1.5 border rounded text-center">
                <span>칸 ×</span>
                <input type="number" id="ans_7_seh" placeholder="측면" class="w-16 p-1.5 border rounded text-center">
                <span>칸 =</span>
                <input type="number" id="ans_7_set" placeholder="총" class="w-16 p-1.5 border rounded text-center font-bold text-teal-700">
                <span>칸</span>
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">4. 두 건물 중 더 넓은 건물은?</label>
              <select id="ans_7_bigger" class="w-full text-xs p-2 border rounded-lg font-bold">
                <option value="">선택하세요</option>
                <option value="중화전">중화전</option>
                <option value="석어당">석어당</option>
              </select>
            </div>
          </div>
        `
      },
      {
        num: 8,
        title: "[8번]",
        img: "https://images.unsplash.com/photo-1598970434795-0c54fe7c0648?w=800&auto=format&fit=crop&q=80",
        desc: "【H】 중화전은 ○ ○ 궁(덕수궁의 옛 이름)의 정전으로 신하들이 모여 조회를 하던 곳입니다. 고종은 대한제국을 세우며 근대화 의지를 담아 석조전을 지었지만 완공된 해에 국권을 빼앗긴 탓에 정전으로 사용되지 못했습니다. 석조전과 중화전은 대한제국으로 국체를 바꾼 고종의 의지와 시대상이 선명하게 담겨 있는 건축입니다.\n\n1. 덕수궁의 옛 이름은 무엇일까요?\n2. 경운궁의 이름을 덕수궁으로 변경한 이유는 무엇일까요?",
        render: () => `
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">1. 덕수궁의 옛 이름은?</label>
              <input type="text" id="ans_8_old" placeholder="궁궐 이름" class="w-full text-xs p-2 border rounded-lg font-bold">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">2. '덕수궁'으로 이름을 변경한 이유</label>
              <textarea id="ans_8_why" rows="2" placeholder="고종 황제의 장수와 덕을 기리는 의미로..." class="w-full text-xs p-2 border rounded-lg"></textarea>
            </div>
          </div>
        `
      },
      {
        num: 9,
        title: "[9번]",
        img: "https://images.unsplash.com/photo-1583037189850-1921ae7c6c22?w=800&auto=format&fit=crop&q=80",
        desc: "【M】 궁궐의 건물들은 일반적으로 같은 방향으로 짓지만 중화전과 석조전 두 건물은 서로 어긋나게 배치되어 있음을 알 수 있습니다. 중화전과 석조전의 방향이 몇 도 차이 나는지 그림을 보고 짐작해보세요.\n\n💡 [현장 관측 안내]\n석조전 뒤쪽은 공간이 좁고 들어갈 수 없으므로, 시야가 탁 트인 **'중화전 앞마당(조정 박석)'**에 서서 스마트폰 나침반 센서나 각도 슬라이더로 측정해 보세요!",
        render: () => `
          <div class="space-y-3">
            <div class="bg-teal-50 border border-teal-200 p-3 rounded-xl space-y-2">
              <span class="block text-xs font-bold text-teal-900">🧭 중화전 앞마당 나침반 방위 측정</span>
              <p class="text-[11px] text-teal-800">품계석 근처에 서서 폰을 각 건물의 정면에 맞추고 기록하세요.</p>
              <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="recordHeading('jh')" class="p-2 bg-white border border-teal-300 rounded-lg text-xs font-bold text-slate-700 active:bg-teal-100 flex flex-col items-center">
                  <span>1. 중화전 정면</span>
                  <span id="jhHeadingText" class="text-teal-600 mt-0.5">미측정</span>
                </button>
                <button type="button" onclick="recordHeading('sj')" class="p-2 bg-white border border-teal-300 rounded-lg text-xs font-bold text-slate-700 active:bg-teal-100 flex flex-col items-center">
                  <span>2. 석조전 정면</span>
                  <span id="sjHeadingText" class="text-teal-600 mt-0.5">미측정</span>
                </button>
              </div>
              <div class="text-center font-bold text-xs text-teal-900 pt-1">
                계산된 축 어긋남 각도: <span id="sensorAngleVal" class="text-teal-700">0</span>°
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">두 건물의 방향이 몇 도 차이 나는지 짐작치 입력:</label>
              <div class="flex items-center space-x-2">
                <input type="range" id="ans_9_slider" min="0" max="45" value="15" oninput="document.getElementById('ans_9_deg').value = this.value" class="flex-1 accent-teal-600">
                <div class="flex items-center">
                  <input type="number" id="ans_9_deg" value="15" oninput="document.getElementById('ans_9_slider').value = this.value" class="w-16 text-center text-xs p-1.5 border rounded-lg font-bold">
                  <span class="text-xs font-bold ml-1 text-slate-700">°</span>
                </div>
              </div>
            </div>
          </div>
        `
      },
      {
        num: 10,
        title: "[10번]",
        img: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=800&auto=format&fit=crop&q=80",
        desc: "【M】 지금 현재 시간은 몇 시 일까요? 미술관 앞 해시계를 찾아 시간을 알아보세요.\n\n1. 해시계를 보는 방법은?\n2. 지금 몇 시인지 사진을 찍어서 보내 주세요.",
        render: () => `
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">1. 해시계(앙부일구)를 보는 방법은?</label>
              <textarea id="ans_10_how" rows="2" placeholder="영침의 그림자 끝이 가리키는 시각선과 24절기선을..." class="w-full text-xs p-2 border rounded-lg"></textarea>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">2. 해시계로 측정한 현재 시각</label>
              <input type="text" id="ans_10_time" placeholder="예: 오후 2시 10분경" class="w-full text-xs p-2 border rounded-lg font-bold">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">해시계 현장 사진 첨부</label>
              <input type="file" accept="image/*" capture="environment" id="ans_10_photo" class="text-xs w-full text-slate-500">
            </div>
          </div>
        `
      }
    ];

    let currentTeamName = localStorage.getItem('deoksu_active_team') || '';
    let currentTeamMembers = localStorage.getItem('deoksu_active_members') || '';
    let currentIdx = 0;
    let answersStore = JSON.parse(localStorage.getItem('deoksu_answers') || '{}');
    let currentDeviceHeading = 0;
    let headingJH = null;
    let headingSJ = null;

    window.addEventListener('DOMContentLoaded', () => {
      initCompass();
      if (currentTeamName) {
        document.getElementById('inputTeamNum').value = currentTeamName;
        document.getElementById('inputMembers').value = currentTeamMembers;
        startAppView();
      }
    });

    function handleStartTour() {
      const teamNum = document.getElementById('inputTeamNum').value;
      const members = document.getElementById('inputMembers').value.trim();

      currentTeamName = teamNum;
      currentTeamMembers = members;

      localStorage.setItem('deoksu_active_team', currentTeamName);
      localStorage.setItem('deoksu_active_members', currentTeamMembers);

      startAppView();
    }

    function startAppView() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('missionDeck').classList.remove('hidden');
      document.getElementById('btnOpenReport').classList.remove('hidden');
      
      const badgeText = currentTeamMembers 
        ? `${currentTeamName} (${currentTeamMembers})` 
        : `${currentTeamName} 활동 중`;
      document.getElementById('navTeamInfo').innerText = badgeText;

      renderTabs();
      showSlide(0);
    }

    function renderTabs() {
      const wrapper = document.getElementById('tabsWrapper');
      wrapper.innerHTML = '';
      SLIDES_DATA.forEach((s, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `flex-shrink-0 w-8 h-8 rounded-full text-xs font-bold border transition flex items-center justify-center ${
          i === currentIdx
            ? 'bg-teal-600 text-white border-teal-600 shadow'
            : hasAnswer(s.num)
            ? 'bg-teal-50 text-teal-700 border-teal-300'
            : 'bg-white text-slate-500 border-slate-300'
        }`;
        btn.innerText = s.num;
        btn.onclick = () => showSlide(i);
        wrapper.appendChild(btn);
      });
    }

    function showSlide(idx) {
      currentIdx = idx;
      const s = SLIDES_DATA[idx];

      document.getElementById('viewSlideNum').innerText = s.title;
      document.getElementById('viewSlideImg').src = s.img;
      document.getElementById('viewSlideDesc').innerText = s.desc;
      document.getElementById('viewInteractiveZone').innerHTML = s.render();

      restoreSlideAnswers(s.num);
      renderTabs();
    }

    function moveSlide(dir) {
      saveCurrentData();
      const next = currentIdx + dir;
      if (next >= 0 && next < SLIDES_DATA.length) {
        showSlide(next);
      }
    }

    function saveCurrentData() {
      const s = SLIDES_DATA[currentIdx];
      if (!answersStore[currentTeamName]) answersStore[currentTeamName] = {};

      const currentAnswers = {};
      const inputs = document.querySelectorAll('#viewInteractiveZone input, #viewInteractiveZone select, #viewInteractiveZone textarea');
      inputs.forEach(inp => {
        if (inp.type === 'file') {
          if (inp.files && inp.files[0]) currentAnswers[inp.id] = `[사진: ${inp.files[0].name}]`;
        } else {
          currentAnswers[inp.id] = inp.value;
        }
      });

      answersStore[currentTeamName][s.num] = currentAnswers;
      localStorage.setItem('deoksu_answers', JSON.stringify(answersStore));

      renderTabs();
      const toast = document.getElementById('saveToast');
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 1500);
    }

    function restoreSlideAnswers(num) {
      if (!answersStore[currentTeamName] || !answersStore[currentTeamName][num]) return;
      const data = answersStore[currentTeamName][num];
      for (const [k, v] of Object.entries(data)) {
        const el = document.getElementById(k);
        if (el && el.type !== 'file') el.value = v;
      }
    }

    function hasAnswer(num) {
      return Boolean(answersStore[currentTeamName] && answersStore[currentTeamName][num]);
    }

    // 9번 나침반 방위 측정
    function initCompass() {
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
          if (e.webkitCompassHeading) currentDeviceHeading = e.webkitCompassHeading;
          else if (e.alpha) currentDeviceHeading = 360 - e.alpha;
        }, true);
      }
    }

    function recordHeading(target) {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') executeHeading(target);
          else alert('나침반 권한을 허용해 주세요.');
        }).catch(() => executeHeading(target));
      } else {
        executeHeading(target);
      }
    }

    function executeHeading(target) {
      const heading = Math.round(currentDeviceHeading % 360);
      if (target === 'jh') {
        headingJH = heading;
        const el = document.getElementById('jhHeadingText');
        if (el) el.innerText = `${heading}°`;
      } else if (target === 'sj') {
        headingSJ = heading;
        const el = document.getElementById('sjHeadingText');
        if (el) el.innerText = `${heading}°`;
      }

      if (headingJH !== null && headingSJ !== null) {
        let diff = Math.abs(headingJH - headingSJ);
        if (diff > 180) diff = 360 - diff;
        const valEl = document.getElementById('sensorAngleVal');
        if (valEl) valEl.innerText = diff;
        const degInp = document.getElementById('ans_9_deg');
        const sliderInp = document.getElementById('ans_9_slider');
        if (degInp) degInp.value = diff;
        if (sliderInp) sliderInp.value = diff;
      }
    }

    // 결과 보고서
    function openReportModal() {
      saveCurrentData();
      const modal = document.getElementById('reportModal');
      const body = document.getElementById('reportContent');
      const data = answersStore[currentTeamName] || {};

      document.getElementById('reportHeaderTitle').innerText = `[${currentTeamName}] 탐구 최종 답안`;
      let html = `<div class="p-2.5 bg-slate-100 rounded-xl mb-2">
        <p class="font-bold text-slate-800">${currentTeamName} 탐구 보고서</p>
        <p class="text-[11px] text-slate-500">조원: ${currentTeamMembers || '미기재'}</p>
      </div>`;

      SLIDES_DATA.forEach(s => {
        const ans = data[s.num] || {};
        const entries = Object.entries(ans);
        html += `<div class="p-2.5 border rounded-lg bg-white space-y-1">
          <div class="font-bold text-teal-800">${s.title}</div>`;
        if (entries.length === 0) {
          html += `<div class="text-slate-400 italic">미입력</div>`;
        } else {
          entries.forEach(([k, v]) => {
            html += `<div class="text-slate-700 pl-1">• ${k.replace('ans_', '')}: <strong>${v || '미입력'}</strong></div>`;
          });
        }
        html += `</div>`;
      });

      body.innerHTML = html;
      modal.classList.remove('hidden');
    }

    function copyToClipboard() {
      const data = answersStore[currentTeamName] || {};
      let txt = `[덕수궁 탐구 결과 - ${currentTeamName}]\n조원: ${currentTeamMembers || '미기재'}\n`;
      SLIDES_DATA.forEach(s => {
        txt += `\n${s.title}\n`;
        const ans = data[s.num] || {};
        const entries = Object.entries(ans);
        if (entries.length === 0) txt += `(미입력)\n`;
        else {
          entries.forEach(([k, v]) => {
            txt += `- ${k.replace('ans_', '')}: ${v || '미입력'}\n`;
          });
        }
      });

      navigator.clipboard.writeText(txt).then(() => {
        alert('보고서 내용이 복사되었습니다! 카톡이나 패들렛에 붙여넣기 하세요.');
      });
    }
  </script>
</body>
</html>
