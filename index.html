<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>덕수궁 수학·역사 융합 현장 미션</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- QRCode.js & jsQR for QR scanner -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    /* 슬라이드 특유의 청록색 곡선 상단 헤더 */
    .slide-curve-header {
      background: linear-gradient(180deg, #1898b5 0%, #30b6c6 60%, rgba(255,255,255,0) 100%);
      border-radius: 0 0 50% 50% / 0 0 25px 25px;
    }
  </style>
</head>
<body class="bg-slate-200 text-slate-800 font-sans antialiased pb-20 select-none">

  <!-- 교사용 / 공통 앱 헤더 바 -->
  <nav class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-2.5 shadow-sm flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-7 h-7 rounded-lg bg-teal-600 text-white flex items-center justify-center font-bold text-xs shadow">덕</div>
      <div>
        <h1 class="text-xs font-bold text-slate-900 leading-none">덕수궁 매쓰 투어</h1>
        <span id="navTeamBadge" class="text-[11px] text-teal-700 font-semibold">로그인 필요</span>
      </div>
    </div>
    <div class="flex items-center space-x-1.5">
      <button onclick="openQrScannerModal()" class="px-2.5 py-1 bg-teal-50 text-teal-700 border border-teal-200 rounded-lg text-xs font-bold flex items-center space-x-1">
        <i data-lucide="qr-code" class="w-3.5 h-3.5"></i>
        <span>QR로그인</span>
      </button>
      <button onclick="toggleTeacherModal(true)" class="p-1.5 text-slate-500 hover:text-slate-800 rounded-lg text-xs" title="교사용 QR 발급">
        <i data-lucide="settings" class="w-4 h-4"></i>
      </button>
    </div>
  </nav>

  <!-- 메인 프레임 (슬라이드 종횡비 모바일 카드 형태) -->
  <main class="max-w-md mx-auto p-3 space-y-3">

    <!-- 0. 로그인 섹션 (QR 또는 모둠 선택) -->
    <section id="loginCard" class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 text-center space-y-5 my-4">
      <div class="w-20 h-20 bg-teal-50 rounded-full flex items-center justify-center mx-auto text-teal-600 shadow-inner">
        <i data-lucide="map-pin" class="w-10 h-10"></i>
      </div>
      <div>
        <h2 class="text-xl font-black text-slate-900 tracking-tight">덕수궁 현장 미션</h2>
        <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">
          배부받은 모둠 QR코드를 비추거나<br>아래에서 우리 모둠을 선택하여 시작하세요.
        </p>
      </div>

      <div class="space-y-3 pt-2">
        <button onclick="openQrScannerModal()" class="w-full py-3.5 bg-teal-600 hover:bg-teal-700 active:scale-95 text-white rounded-2xl font-bold text-sm shadow flex items-center justify-center space-x-2 transition">
          <i data-lucide="camera" class="w-4 h-4"></i>
          <span>모둠 QR 코드 스캔하기</span>
        </button>

        <div class="flex items-center space-x-2 py-1">
          <div class="flex-1 border-t border-slate-200"></div>
          <span class="text-xs text-slate-400">또는</span>
          <div class="flex-1 border-t border-slate-200"></div>
        </div>

        <div class="flex space-x-2">
          <select id="teamSelect" class="flex-1 bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-xl p-2.5 font-bold focus:ring-teal-500 focus:border-teal-500">
            <option value="">모둠 선택</option>
            <option value="1모둠">1모둠</option>
            <option value="2모둠">2모둠</option>
            <option value="3모둠">3모둠</option>
            <option value="4모둠">4모둠</option>
            <option value="5모둠">5모둠</option>
            <option value="6모둠">6모둠</option>
          </select>
          <button onclick="manualLogin()" class="px-5 py-2.5 bg-slate-800 text-white rounded-xl text-sm font-bold shadow hover:bg-slate-900 active:scale-95 transition">
            입장
          </button>
        </div>
      </div>
    </section>

    <!-- 1~10번 슬라이드 미션 카드 덱 -->
    <div id="missionDeck" class="hidden space-y-3">

      <!-- 1~10번 슬라이드 이동 탭 버튼 -->
      <div class="flex items-center space-x-1.5 overflow-x-auto py-1 scrollbar-none" id="tabsWrapper"></div>

      <!-- 원본 슬라이드 비주얼 카드 컨테이너 -->
      <div class="bg-white rounded-3xl shadow-lg border border-slate-300 overflow-hidden relative">

        <!-- 슬라이드 상단 디자인 (청록색 그라디언트 + [O번] 타이틀) -->
        <div class="slide-curve-header pt-4 pb-6 px-4 text-center relative">
          <h2 id="slideNumberTitle" class="text-xl font-black text-slate-900 tracking-wider drop-shadow-sm font-mono">[1번]</h2>
        </div>

        <!-- 슬라이드 핵심 사진 이미지 -->
        <div class="px-4 -mt-2">
          <div class="relative w-full aspect-[16/10] bg-slate-100 rounded-2xl overflow-hidden shadow-md border border-slate-200 flex items-center justify-center">
            <img id="slideMainImage" src="" alt="현장 미션 사진" class="w-full h-full object-cover">
          </div>
        </div>

        <!-- 슬라이드 텍스트 지문 -->
        <div class="p-4 space-y-3">
          <div id="slideQuestionText" class="text-xs sm:text-sm font-medium text-slate-800 leading-relaxed whitespace-pre-line bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
          </div>

          <!-- 미션별 인터랙티브 폼 입력 영역 -->
          <div id="interactiveZone" class="pt-2 border-t border-slate-100 space-y-3"></div>

          <!-- 임시 저장 알림 배너 -->
          <div id="saveFeedback" class="hidden p-2.5 bg-teal-50 border border-teal-200 text-teal-800 rounded-xl text-xs font-bold text-center">
            ✓ 답안이 실시간 저장되었습니다.
          </div>
        </div>

        <!-- 하단 네비게이션 버튼 바 -->
        <div class="bg-slate-50 border-t border-slate-200 px-4 py-3 flex items-center justify-between">
          <button id="btnPrev" onclick="navigateStep(-1)" class="px-3.5 py-2 text-xs font-bold text-slate-600 bg-white border border-slate-300 rounded-xl hover:bg-slate-100 flex items-center space-x-1 shadow-sm">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
            <span>이전</span>
          </button>
          <button onclick="saveCurrentStep()" class="px-4 py-2 text-xs font-bold text-white bg-teal-600 hover:bg-teal-700 rounded-xl shadow flex items-center space-x-1">
            <i data-lucide="save" class="w-4 h-4"></i>
            <span>답안 저장</span>
          </button>
          <button id="btnNext" onclick="navigateStep(1)" class="px-3.5 py-2 text-xs font-bold text-slate-600 bg-white border border-slate-300 rounded-xl hover:bg-slate-100 flex items-center space-x-1 shadow-sm">
            <span>다음</span>
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>

      </div>

      <!-- 최종 보고서 확인 & 제출 버튼 -->
      <button onclick="openReportModal()" class="w-full py-3.5 bg-gradient-to-r from-teal-700 via-teal-600 to-slate-800 text-white rounded-2xl font-bold text-sm shadow-md flex items-center justify-center space-x-2 active:scale-98 transition">
        <i data-lucide="send" class="w-4 h-4"></i>
        <span>모둠 전체 답안 검토 및 선생님께 전송</span>
      </button>

    </div>

  </main>

  <!-- QR 코드 스캐너 모달 -->
  <div id="qrScannerModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-4 w-full max-w-sm flex flex-col items-center space-y-3">
      <div class="w-full flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-800">모둠 QR코드 스캔</h3>
        <button onclick="closeQrScannerModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="relative w-full aspect-square bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center">
        <video id="qrVideo" class="w-full h-full object-cover"></video>
        <canvas id="qrCanvas" class="hidden"></canvas>
        <div class="absolute inset-8 border-2 border-dashed border-teal-400 rounded-lg pointer-events-none animate-pulse"></div>
      </div>
      <p class="text-xs text-slate-500 text-center">선생님이 나눠주신 QR코드를 네모 안에 맞춰주세요.</p>
    </div>
  </div>

  <!-- 교사용 QR 발급 모달 -->
  <div id="teacherModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div>
          <h3 class="font-bold text-sm text-slate-800">교사용: 모둠별 자동로그인 QR</h3>
          <p class="text-[11px] text-slate-500">학생들에게 출력하거나 화면으로 보여주세요.</p>
        </div>
        <button onclick="toggleTeacherModal(false)" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-4 overflow-y-auto space-y-3" id="teacherQrList"></div>
      <div class="p-3 border-t border-slate-200 bg-slate-50 flex justify-end">
        <button onclick="window.print()" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-bold flex items-center space-x-1.5 shadow">
          <i data-lucide="printer" class="w-4 h-4"></i>
          <span>인쇄하기</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 최종 결과 보고서 모달 -->
  <div id="reportModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 class="font-bold text-sm text-slate-800" id="reportTitle">모둠 최종 탐구 답안</h3>
        <button onclick="document.getElementById('reportModal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-4 overflow-y-auto space-y-3 text-xs" id="reportBody"></div>
      <div class="p-3 border-t border-slate-200 bg-slate-50 flex space-x-2">
        <button onclick="copyReportText()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold flex items-center justify-center space-x-1">
          <i data-lucide="copy" class="w-4 h-4"></i>
          <span>전체 텍스트 복사</span>
        </button>
        <button onclick="document.getElementById('reportModal').classList.add('hidden')" class="px-4 py-2.5 bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">
          닫기
        </button>
      </div>
    </div>
  </div>

  <!-- 슬라이드 데이터 및 인터랙션 로직 -->
  <script>
    const SLIDES = [
      {
        num: 1,
        title: "[1번]",
        img: "https://images.unsplash.com/photo-1598970434795-0c54fe7c0648?w=800&auto=format&fit=crop&q=80",
        desc: "【H】 덕수궁에 들어가려면 정문인 '대한문'을 지나야 합니다. 대한문에는 문이 3개가 있다. 이는 신분에 따라 출입을 달리 하기 위해서입니다. 다음 문은 누가 드나들던 문일까요?",
        render: () => `
          <div class="grid grid-cols-3 gap-2">
            <div class="bg-slate-50 p-2 border border-slate-200 rounded-xl text-center">
              <span class="block text-xs font-bold mb-1 text-slate-700">왼쪽 문</span>
              <select id="ans_1_left" class="w-full text-xs p-1.5 border rounded-lg bg-white">
                <option value="">선택</option>
                <option value="왕(황제)">왕(황제)</option>
                <option value="문관(동반)">문관(동반)</option>
                <option value="무관(서반)">무관(서반)</option>
              </select>
            </div>
            <div class="bg-slate-50 p-2 border border-slate-200 rounded-xl text-center">
              <span class="block text-xs font-bold mb-1 text-slate-700">중간 문</span>
              <select id="ans_1_mid" class="w-full text-xs p-1.5 border rounded-lg bg-white">
                <option value="">선택</option>
                <option value="왕(황제)">왕(황제)</option>
                <option value="문관(동반)">문관(동반)</option>
                <option value="무관(서반)">무관(서반)</option>
              </select>
            </div>
            <div class="bg-slate-50 p-2 border border-slate-200 rounded-xl text-center">
              <span class="block text-xs font-bold mb-1 text-slate-700">오른쪽 문</span>
              <select id="ans_1_right" class="w-full text-xs p-1.5 border rounded-lg bg-white">
                <option value="">선택</option>
                <option value="왕(황제)">왕(황제)</option>
                <option value="문관(동반)">문관(동반)</option>
                <option value="무관(서반)">무관(서반)</option>
              </select>
            </div>
          </div>
          <p class="text-[11px] text-slate-400 text-center">💡 팁: 왕이 궁궐 안에서 남쪽을 바라보는 시선 기준</p>
        `
      },
      {
        num: 2,
        title: "[2번]",
        img: "https://images.unsplash.com/photo-1598970434795-0c54fe7c0648?w=800&auto=format&fit=crop&q=80",
        desc: "【M】 문의 폭의 비는 얼마일까요?\n\n• 폭의 비를 측정한 방법을 동영상으로 찍어서 보내주세요.\n• 문의 폭의 비는 얼마인가요?",
        render: () => `
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">문의 폭의 비 (왼쪽 : 중간 : 오른쪽)</label>
              <div class="flex items-center space-x-1">
                <input type="text" id="ans_2_l" placeholder="왼쪽" class="w-1/3 text-center text-xs p-2 border rounded-lg">
                <span>:</span>
                <input type="text" id="ans_2_m" placeholder="중간" class="w-1/3 text-center text-xs p-2 border rounded-lg">
                <span>:</span>
                <input type="text" id="ans_2_r" placeholder="오른쪽" class="w-1/3 text-center text-xs p-2 border rounded-lg">
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">폭의 비를 측정한 방법 설명</label>
              <input type="text" id="ans_2_how" placeholder="예: 신발 길이, 보폭, 줄자 등으로 측정" class="w-full text-xs p-2 border rounded-lg">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">측정 사진/동영상 첨부</label>
              <input type="file" accept="image/*,video/*" capture="environment" id="ans_2_file" class="text-xs w-full text-slate-500">
            </div>
          </div>
        `
      },
      {
        num: 3,
        title: "[3번]",
        img: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&auto=format&fit=crop&q=80",
        desc: "【H】 함녕전 뒤뜰의 북쪽 방향에 있는 초록색 지붕의 건물로 러시아의 건축가 사바틴이 1900년에 지은 것으로 고종이 세자인 순종과 함께 음악을 듣고 커피를 마신 곳입니다. 이곳을 찾아 모둠끼리 인증샷을 찍어 보내고 이 건물의 이름을 적어 보내주세요.",
        render: () => `
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">이 건물의 이름은?</label>
              <input type="text" id="ans_3_name" placeholder="전각 이름을 입력하세요" class="w-full text-xs p-2.5 border rounded-lg font-bold">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">모둠 현장 인증샷</label>
              <input type="file" accept="image/*" capture="environment" id="ans_3_photo" class="text-xs w-full text-slate-500">
            </div>
          </div>
        `
      },
      {
        num: 4,
        title: "[4번]",
        img: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&auto=format&fit=crop&q=80",
        desc: "【M】 기둥과 철제 난간, 단청의 그림을 잘 관찰하여 봅시다. 여기에는 꽃, 사슴, 박쥐, 소나무 등이 장식되어 있는데 위 그림과 같은 두 기둥 사이에 장식되어 있는 박쥐가 보이나요?\n\n1. 박쥐의 위치를 사진에서 표시해서 이미지로 보내주세요.\n2. 박쥐는 총 몇 마리인가요?",
        render: () => `
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">두 기둥 사이 박쥐의 총 마리 수는?</label>
              <div class="flex items-center space-x-2">
                <input type="number" id="ans_4_count" placeholder="0" class="w-24 text-center text-xs p-2 border rounded-lg font-bold">
                <span class="text-xs font-bold text-slate-600">마리</span>
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">난간 장식 박쥐 촬영 사진 첨부</label>
              <input type="file" accept="image/*" capture="environment" id="ans_4_photo" class="text-xs w-full text-slate-500">
            </div>
          </div>
        `
      },
      {
        num: 5,
        title: "[5번]",
        img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Korean_Empire_Emblem.svg/640px-Korean_Empire_Emblem.svg.png",
        desc: "【H】 대한제국의 국장으로 일제는 대한제국을 자주 국가가 아니라 천황의 지배를 받는 한 가문으로 낮추기 위해 이 문양을 궁궐 곳곳에 새겨 놓았다고 합니다. 이 문양의 이름은 오얏꽃이라고 합니다.\n\n1. 정관헌, 석조전, 덕홍전의 오얏꽃 문양을 찾아 사진을 찍어 보내 주세요.\n2. 덕홍전 오얏꽃의 색깔은?",
        render: () => `
          <div class="space-y-3">

    function initCompass() {
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
          if (e.webkitCompassHeading) currentDeviceHeading = e.webkitCompassHeading;
          else if (e.alpha) currentDeviceHeading = 360 - e.alpha;
        }, true);
      }
    }

    function recordHeading(target) {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') executeHeading(target);
          else alert('나침반 권한이 필요합니다.');
        }).catch(() => executeHeading(target));
      } else {
        executeHeading(target);
      }
    }

    function executeHeading(target) {
      const heading = Math.round(currentDeviceHeading % 360);
      if (target === 'jh') {
        headingJH = heading;
        const el = document.getElementById('jhHeadingText');
        if (el) el.innerText = `${heading}°`;
      } else if (target === 'sj') {
        headingSJ = heading;
        const el = document.getElementById('sjHeadingText');
        if (el) el.innerText = `${heading}°`;
      }

      if (headingJH !== null && headingSJ !== null) {
        let diff = Math.abs(headingJH - headingSJ);
        if (diff > 180) diff = 360 - diff;
        const valEl = document.getElementById('sensorAngleVal');
        if (valEl) valEl.innerText = diff;
        const degInp = document.getElementById('ans_9_deg');
        const sliderInp = document.getElementById('ans_9_slider');
        if (degInp) degInp.value = diff;
        if (sliderInp) sliderInp.value = diff;
      }
    }

      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => {

          video.srcObject = stream;
          video.setAttribute('playsinline', true);
          video.play();
          qrAnimationId = requestAnimationFrame(tickQr);
        })
        .catch(() => {
          alert('카메라 접근 권한을 허용해주세요.');
          closeQrScannerModal();
        });
    }

    function tickQr() {
      const video = document.getElementById('qrVideo');
      const canvas = document.getElementById('qrCanvas');
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height);

        if (code) {
          try {
            const url = new URL(code.data);
            const team = url.searchParams.get('team');
            if (team) {
              closeQrScannerModal();
              loginTeam(team);
              return;
            }
          } catch(e) {
            if (code.data.includes('모둠')) {
              closeQrScannerModal();
              loginTeam(code.data);
              return;
            }
          }
        }
      }
      qrAnimationId = requestAnimationFrame(tickQr);
    }

    function closeQrScannerModal() {
      if (videoStream) videoStream.getTracks().forEach(t => t.stop());

      let txt = `[덕수궁 탐구 결과 - ${currentTeam}]\n`;
      SLIDES.forEach(s => {
        txt += `\n${s.title}\n`;
        const ans = data[s.num] || {};
        const entries = Object.entries(ans);
        if (entries.length === 0) txt += `(미입력)\n`;
        else {
          entries.forEach(([k, v]) => {
            txt += `- ${k.replace('ans_', '')}: ${v || '미입력'}\n`;
          });
        }
      });

      navigator.clipboard.writeText(txt).then(() => {
        alert('보고서 텍스트가 복사되었습니다! 카카오톡이나 패들렛에 붙여넣기 하세요.');
      });
    }
  </script>
</body>
</html>
