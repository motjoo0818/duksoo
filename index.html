<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>덕수궁 수학·역사 융합 현장 미션 투어</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- QRCode Generator & jsQR Scanner -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased pb-24">

  <!-- 상단 네비게이션 헤더 -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-3 shadow-sm flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-teal-600 text-white flex items-center justify-center font-bold text-sm shadow">
        덕
      </div>
      <div>
        <h1 class="text-sm font-bold text-slate-900 leading-tight">덕수궁 매쓰 투어</h1>
        <p id="headerTeamBadge" class="text-xs text-teal-700 font-medium">로그인이 필요합니다</p>
      </div>
    </div>
    <div class="flex items-center space-x-1.5">
      <button onclick="openQrScannerModal()" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold flex items-center space-x-1 border border-slate-300">
        <i data-lucide="qr-code" class="w-3.5 h-3.5"></i>
        <span>QR스캔</span>
      </button>
      <button onclick="toggleTeacherModal(true)" class="p-1.5 text-slate-500 hover:text-slate-800 rounded-lg text-xs" title="교사용 관리">
        <i data-lucide="settings" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- 진척도 바 -->
  <div id="progressBarContainer" class="hidden bg-white border-b border-slate-200 px-4 py-2">
    <div class="flex items-center justify-between text-xs font-semibold text-slate-600 mb-1">
      <span id="progressText">진행도: 0 / 10 미션</span>
      <span id="progressPercent" class="text-teal-600">0%</span>
    </div>
    <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
      <div id="progressBar" class="bg-teal-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
    </div>
  </div>

  <!-- 메인 컨테이너 -->
  <main class="max-w-md mx-auto px-4 py-4 space-y-4">

    <!-- 로그인 카드 -->
    <section id="loginCard" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 text-center space-y-4">
      <div class="w-16 h-16 bg-teal-50 rounded-2xl flex items-center justify-center mx-auto text-teal-600">
        <i data-lucide="compass" class="w-8 h-8"></i>
      </div>
      <div>
        <h2 class="text-lg font-bold text-slate-900">현장 탐구 모둠 로그인</h2>
        <p class="text-xs text-slate-500 mt-1">모둠 QR 코드를 카메라로 비추거나 모둠을 직접 선택하세요.</p>
      </div>

      <div class="space-y-2">
        <button onclick="openQrScannerModal()" class="w-full py-3 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-bold text-sm shadow flex items-center justify-center space-x-2">
          <i data-lucide="camera" class="w-4 h-4"></i>
          <span>모둠 전용 QR코드 스캔하기</span>
        </button>
        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="flex-shrink mx-3 text-xs text-slate-400">또는 직접 모둠 선택</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>
        <div class="flex space-x-2">
          <select id="teamSelect" class="flex-1 bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-xl p-2.5 font-medium focus:ring-teal-500 focus:border-teal-500">
            <option value="">모둠을 선택하세요</option>
            <option value="1모둠">1모둠</option>
            <option value="2모둠">2모둠</option>
            <option value="3모둠">3모둠</option>
            <option value="4모둠">4모둠</option>
            <option value="5모둠">5모둠</option>
            <option value="6모둠">6모둠</option>
          </select>
          <button onclick="manualLogin()" class="px-4 py-2.5 bg-slate-800 text-white rounded-xl text-sm font-bold shadow hover:bg-slate-900">
            입장
          </button>
        </div>
      </div>
    </section>

    <!-- 미션 컨텐츠 영역 -->
    <div id="missionDeck" class="hidden space-y-4">

      <!-- 미션 탭 (가로 스크롤) -->
      <div class="flex items-center space-x-2 overflow-x-auto pb-2 scrollbar-none" id="tabsWrapper"></div>

      <!-- 개별 미션 카드 -->
      <div id="currentMissionCard" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="bg-teal-700 text-white px-4 py-3 flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <span id="missionBadgeType" class="px-2 py-0.5 rounded bg-teal-800 text-teal-100 font-mono text-xs font-bold">[M]</span>
            <span id="missionTitle" class="font-bold text-sm tracking-wide">[1번]</span>
          </div>
          <span id="missionSubTitle" class="text-xs text-teal-100">현장 탐구</span>
        </div>

        <div class="p-4 space-y-4">
          <!-- 문제 지문 -->
          <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-100 text-xs sm:text-sm leading-relaxed text-slate-700 whitespace-pre-line" id="missionDesc"></div>

          <!-- 인터랙티브 작업창 -->
          <div id="missionInteractiveZone" class="space-y-3 pt-2 border-t border-slate-100"></div>

          <!-- 상태 알림 피드백 -->
          <div id="missionFeedback" class="hidden p-3 rounded-xl text-xs font-medium"></div>
        </div>

        <!-- 하단 네비게이션 -->
        <div class="bg-slate-50 border-t border-slate-200 px-4 py-3 flex items-center justify-between">
          <button id="btnPrev" onclick="navigateMission(-1)" class="px-3.5 py-2 text-xs font-bold text-slate-600 bg-white border border-slate-300 rounded-xl hover:bg-slate-100 flex items-center space-x-1">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
            <span>이전</span>
          </button>
          <button onclick="saveCurrentStep()" class="px-4 py-2 text-xs font-bold text-white bg-teal-600 rounded-xl hover:bg-teal-700 shadow flex items-center space-x-1">
            <i data-lucide="save" class="w-4 h-4"></i>
            <span>답안 저장</span>
          </button>
          <button id="btnNext" onclick="navigateMission(1)" class="px-3.5 py-2 text-xs font-bold text-slate-600 bg-white border border-slate-300 rounded-xl hover:bg-slate-100 flex items-center space-x-1">
            <span>다음</span>
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- 전체 보고서 전송 버튼 -->
      <button onclick="showFinalReport()" class="w-full py-3.5 bg-gradient-to-r from-teal-600 to-slate-800 text-white rounded-2xl font-bold text-sm shadow flex items-center justify-center space-x-2">
        <i data-lucide="file-check" class="w-5 h-5"></i>
        <span>모둠 전체 답안 검토 및 전송</span>
      </button>
    </div>

  </main>

  <!-- QR 코드 스캐너 모달 -->
  <div id="qrScannerModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-4 w-full max-w-sm flex flex-col items-center space-y-3">
      <div class="w-full flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-800">모둠 QR코드 스캔</h3>
        <button onclick="closeQrScannerModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="relative w-full aspect-square bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center">
        <video id="qrVideo" class="w-full h-full object-cover"></video>
        <canvas id="qrCanvas" class="hidden"></canvas>
        <div class="absolute inset-8 border-2 border-dashed border-teal-400 rounded-lg pointer-events-none animate-pulse"></div>
      </div>
      <p class="text-xs text-slate-500 text-center">선생님이 나눠주신 모둠 QR코드를 네모 안에 맞춰주세요.</p>
    </div>
  </div>

  <!-- 교사용 모둠별 QR 발급 모달 -->
  <div id="teacherModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div>
          <h3 class="font-bold text-sm text-slate-800">교사용: 모둠별 자동로그인 QR</h3>
          <p class="text-xs text-slate-500">학생들에게 화면으로 보여주거나 출력해 배부하세요.</p>
        </div>
        <button onclick="toggleTeacherModal(false)" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-4 overflow-y-auto space-y-4" id="teacherQrList"></div>
      <div class="p-3 border-t border-slate-200 bg-slate-50 flex justify-end">
        <button onclick="window.print()" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-bold flex items-center space-x-1.5 shadow">
          <i data-lucide="printer" class="w-4 h-4"></i>
          <span>인쇄하기</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 최종 결과 보고서 모달 -->
  <div id="reportModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 class="font-bold text-sm text-slate-800" id="reportTitle">모둠 최종 탐구 보고서</h3>
        <button onclick="document.getElementById('reportModal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-4 overflow-y-auto space-y-3 text-xs" id="reportBody"></div>
      <div class="p-3 border-t border-slate-200 bg-slate-50 flex space-x-2">
        <button onclick="copyReportText()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold flex items-center justify-center space-x-1">
          <i data-lucide="copy" class="w-4 h-4"></i>
          <span>보고서 텍스트 복사</span>
        </button>
        <button onclick="document.getElementById('reportModal').classList.add('hidden')" class="px-4 py-2.5 bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">
          닫기
        </button>
      </div>
    </div>
  </div>

  <!-- 전체 스크립트 로직 -->
  <script>
    const MISSIONS = [
      {
        id: 1,
        type: 'H',
        title: '[1번] 대한문 세 개의 문',
        desc: "덕수궁에 들어가려면 정문인 '대한문'을 지나야 합니다. 대한문에는 문이 3개가 있습니다. 이는 신분에 따라 출입을 달리 하기 위해서입니다.\n\n다음 문은 누가 드나들던 문일까요?",
        render: () => `
          <div class="grid grid-cols-3 gap-2">
            <div class="bg-slate-50 border border-slate-200 p-2 rounded-xl text-center">
              <span class="block text-xs font-bold text-slate-700 mb-1">왼쪽 문</span>
              <select id="ans_1_left" class="w-full text-xs p-1.5 border rounded-lg bg-white">
                <option value="">선택</option>
                <option value="왕(황제)">왕(황제)</option>
                <option value="문관(동반)">문관(동반)</option>
                <option value="무관(서반)">무관(서반)</option>
              </select>
            </div>
            <div class="bg-slate-50 border border-slate-200 p-2 rounded-xl text-center">
              <span class="block text-xs font-bold text-slate-700 mb-1">중간 문</span>
              <select id="ans_1_mid" class="w-full text-xs p-1.5 border rounded-lg bg-white">
                <option value="">선택</option>
                <option value="왕(황제)">왕(황제)</option>
                <option value="문관(동반)">문관(동반)</option>
                <option value="무관(서반)">무관(서반)</option>
              </select>
            </div>
            <div class="bg-slate-50 border border-slate-200 p-2 rounded-xl text-center">
              <span class="block text-xs font-bold text-slate-700 mb-1">오른쪽 문</span>
              <select id="ans_1_right" class="w-full text-xs p-1.5 border rounded-lg bg-white">
                <option value="">선택</option>
                <option value="왕(황제)">왕(황제)</option>
                <option value="문관(동반)">문관(동반)</option>
                <option value="무관(서반)">무관(서반)</option>
              </select>
            </div>
          </div>
          <p class="text-[11px] text-slate-400 text-center">💡 팁: 궁궐 안에서 남쪽(정문)을 바라보는 시선이 기준입니다!</p>
        `
      },
      {
        id: 2,
        type: 'M',
        title: '[2번] 대한문 폭의 비 측정',
        desc: "문의 폭의 비는 얼마일까요?\n\n• 폭의 비를 측정한 방법을 동영상이나 사진으로 찍어서 기록하세요.\n• 문의 폭의 비는 얼마인가요?",
        render: () => `
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">1. 측정한 비 입력 (왼쪽 : 중간 : 오른쪽)</label>
              <div class="flex items-center space-x-1.5">
                <input type="text" id="ans_2_left" placeholder="왼쪽" class="w-1/3 text-center text-xs p-2 border rounded-lg bg-slate-50">
                <span class="font-bold text-slate-400">:</span>
                <input type="text" id="ans_2_mid" placeholder="중간" class="w-1/3 text-center text-xs p-2 border rounded-lg bg-slate-50">
                <span class="font-bold text-slate-400">:</span>
                <input type="text" id="ans_2_right" placeholder="오른쪽" class="w-1/3 text-center text-xs p-2 border rounded-lg bg-slate-50">
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">2. 폭의 비 측정 방법 설명</label>
              <input type="text" id="ans_2_method" placeholder="예: 신발 길이, 보폭, 줄자 사용 등" class="w-full text-xs p-2 border rounded-lg bg-slate-50">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">3. 측정 인증 사진 첨부</label>
              <input type="file" accept="image/*" capture="environment" id="ans_2_photo" class="text-xs w-full text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700">
            </div>
          </div>
        `
      },
      {
        id: 3,
        type: 'H',
        title: '[3번] 초록색 지붕 전각 찾기',
        desc: "함녕전 뒤뜰의 북쪽 방향에 있는 초록색 지붕의 건물로 러시아의 건축가 사바틴이 1900년에 지은 것으로 고종이 세자인 순종과 함께 음악을 듣고 커피를 마신 곳입니다.\n\n이곳을 찾아 모둠끼리 인증샷을 찍고 건물의 이름을 적어주세요.",
        render: () => `
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">건물 이름</label>
              <input type="text" id="ans_3_name" placeholder="건물 이름을 입력하세요" class="w-full text-xs p-2.5 border rounded-lg bg-slate-50 font-bold">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">모둠 현장 인증샷</label>
              <input type="file" accept="image/*" capture="environment" id="ans_3_photo" class="text-xs w-full text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700">
            </div>
          </div>
        `
      },
      {
        id: 4,
        type: 'M',
        title: '[4번] 난간 장식 박쥐 세기',
        desc: "기둥과 철제 난간, 단청의 그림을 잘 관찰하여 봅시다. 여기에는 꽃, 사슴, 박쥐, 소나무 등이 장식되어 있는데 위 그림과 같은 두 기둥 사이에 장식되어 있는 박쥐가 보이나요?\n\n1. 박쥐의 위치를 사진에서 확인하고 촬영하세요.\n2. 박쥐는 총 몇 마리인가요?",
        render: () => `
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">두 기둥 사이 박쥐의 총 마리 수</label>
              <div class="flex items-center space-x-2">
                <input type="number" id="ans_4_count" placeholder="0" class="w-24 text-center text-xs p-2 border rounded-lg bg-slate-50 font-bold">
                <span class="text-xs text-slate-600 font-bold">마리</span>
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">박쥐를 찾은 난간 사진 첨부</label>
              <input type="file" accept="image/*" capture="environment" id="ans_4_photo" class="text-xs w-full text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700">
            </div>
          </div>
        `
      },
      {
        id: 5,
        type: 'H',
        title: '[5번] 대한제국의 국장 오얏꽃',
        desc: "대한제국의 국장으로 일제는 대한제국을 자주 국가가 아니라 천황의 지배를 받는 한 가문으로 낮추기 위해 이 문양을 궁궐 곳곳에 새겨 놓았다고 합니다. 이 문양의 이름은 오얏꽃이라고 합니다.\n\n1. 정관헌, 석조전, 덕홍전의 오얏꽃 문양을 찾아 사진을 찍어 보세요.\n2. 덕홍전 오얏꽃의 색깔은?",
        render: () => `
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">덕홍전 오얏꽃의 색깔은?</label>
              <input type="text" id="ans_5_color" placeholder="예: 황금색, 노란색 등" class="w-full text-xs p-2 border rounded-lg bg-slate-50">
            </div>
            <div class="space-y-2">

    let currentTeam = localStorage.getItem('deoksu_current_team') || '';
    let currentMissionIndex = 0;
    let missionStore = JSON.parse(localStorage.getItem('deoksu_answers') || '{}');
    let currentDeviceHeading = 0;
    let headingJH = null;
    let headingSJ = null;

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initCompassSensor();

      const urlParams = new URLSearchParams(window.location.search);
      const teamParam = urlParams.get('team');
      if (teamParam) {
        loginTeam(teamParam);
      } else if (currentTeam) {
        loginTeam(currentTeam);
      }
    });

    function initCompassSensor() {
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
          if (e.webkitCompassHeading) {
            currentDeviceHeading = e.webkitCompassHeading;
          } else if (e.alpha) {
            currentDeviceHeading = 360 - e.alpha;
          }
        }, true);
      }
    }

    function recordHeading(target) {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') executeRecordHeading(target);
          else alert('나침반 센서 권한이 허용되지 않았습니다.');
        }).catch(() => executeRecordHeading(target));
      } else {
        executeRecordHeading(target);
      }
    }

    function executeRecordHeading(target) {
      const heading = Math.round(currentDeviceHeading % 360);
      if (target === 'jh') {
        headingJH = heading;
        const el = document.getElementById('jhHeadingText');
        if (el) el.innerText = `${heading}°`;
      } else if (target === 'sj') {
        headingSJ = heading;
        const el = document.getElementById('sjHeadingText');
        if (el) el.innerText = `${heading}°`;
      }

      if (headingJH !== null && headingSJ !== null) {
        let diff = Math.abs(headingJH - headingSJ);
        if (diff > 180) diff = 360 - diff;
        const valEl = document.getElementById('sensorAngleVal');
        if (valEl) valEl.innerText = diff;
        const degInp = document.getElementById('ans_9_deg');
        const sliderInp = document.getElementById('ans_9_slider');
        if (degInp) degInp.value = diff;
        if (sliderInp) sliderInp.value = diff;
      }
    }

    function loginTeam(teamName) {
      currentTeam = teamName;
      localStorage.setItem('deoksu_current_team', currentTeam);

      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('missionDeck').classList.remove('hidden');
      document.getElementById('progressBarContainer').classList.remove('hidden');
      document.getElementById('headerTeamBadge').innerText = `${currentTeam} 활동 중`;

      renderTabs();
      loadMission(0);
      updateProgress();
    }

    function manualLogin() {
      const val = document.getElementById('teamSelect').value;
      if (!val) {
        alert('모둠을 선택해주세요!');
        return;
      }
      loginTeam(val);
    }

    function renderTabs() {
      const wrapper = document.getElementById('tabsWrapper');
      wrapper.innerHTML = '';
      MISSIONS.forEach((m, idx) => {
        const btn = document.createElement('button');
        btn.id = `tab-btn-${idx}`;
        btn.className = `flex-shrink-0 w-8 h-8 rounded-full text-xs font-bold transition flex items-center justify-center border ${
          idx === currentMissionIndex
            ? 'bg-teal-600 text-white border-teal-600 shadow-sm'
            : hasAnswer(idx + 1)
            ? 'bg-teal-50 text-teal-700 border-teal-300'
            : 'bg-white text-slate-500 border-slate-300'
        }`;
        btn.innerText = idx + 1;
        btn.onclick = () => loadMission(idx);
        wrapper.appendChild(btn);
      });
    }

    function loadMission(idx) {
      currentMissionIndex = idx;
      const m = MISSIONS[idx];

      document.getElementById('missionBadgeType').innerText = `[${m.type}]`;
      document.getElementById('missionTitle').innerText = m.title;
      document.getElementById('missionSubTitle').innerText = m.type === 'M' ? '수학 탐구' : '역사 탐구';
      document.getElementById('missionDesc').innerText = m.desc;

      const zone = document.getElementById('missionInteractiveZone');
      zone.innerHTML = m.render();

      restoreAnswers(m.id);
      renderTabs();
      lucide.createIcons();
    }

    function navigateMission(direction) {
      saveCurrentStep();
      const next = currentMissionIndex + direction;
      if (next >= 0 && next < MISSIONS.length) {
        loadMission(next);
      }
    }

    function saveCurrentStep() {
      const m = MISSIONS[currentMissionIndex];
      if (!missionStore[currentTeam]) missionStore[currentTeam] = {};

      const currentAnswers = {};
      const inputs = document.querySelectorAll('#missionInteractiveZone input, #missionInteractiveZone select, #missionInteractiveZone textarea');
      inputs.forEach(input => {
        if (input.type === 'file') {
          if (input.files && input.files[0]) {
            currentAnswers[input.id] = `[사진 첨부됨: ${input.files[0].name}]`;
          }
        } else {
          currentAnswers[input.id] = input.value;
        }
      });

      missionStore[currentTeam][m.id] = {
        answers: currentAnswers,
        updatedAt: new Date().toLocaleTimeString('ko-KR')
      };

      localStorage.setItem('deoksu_answers', JSON.stringify(missionStore));
      updateProgress();
      renderTabs();

      const fb = document.getElementById('missionFeedback');
      fb.className = 'p-3 rounded-xl text-xs font-bold bg-teal-50 text-teal-800 border border-teal-200 block';
      fb.innerText = `✓ ${m.id}번 답안이 안전하게 저장되었습니다!`;
      setTimeout(() => fb.classList.add('hidden'), 2000);
    }

    function restoreAnswers(missionId) {
      if (!missionStore[currentTeam] || !missionStore[currentTeam][missionId]) return;
      const saved = missionStore[currentTeam][missionId].answers || {};
      for (const [key, val] of Object.entries(saved)) {
        const el = document.getElementById(key);
        if (el && el.type !== 'file') {
          el.value = val;
        }
      }
    }

    function hasAnswer(missionId) {
      return Boolean(missionStore[currentTeam] && missionStore[currentTeam][missionId]);
    }

    function updateProgress() {
      let count = 0;
      for (let i = 1; i <= MISSIONS.length; i++) {
        if (hasAnswer(i)) count++;
      }
      const pct = Math.round((count / MISSIONS.length) * 100);
      document.getElementById('progressText').innerText = `진행도: ${count} / ${MISSIONS.length} 미션`;
      document.getElementById('progressPercent').innerText = `${pct}%`;
      document.getElementById('progressBar').style.width = `${pct}%`;
    }

    // QR 스캐너
    let videoStream = null;
    let qrScanAnimation = null;

    function openQrScannerModal() {
      document.getElementById('qrScannerModal').classList.remove('hidden');
      const video = document.getElementById('qrVideo');

      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => {
          videoStream = stream;
          video.srcObject = stream;
          video.setAttribute('playsinline', true);
          video.play();
          qrScanAnimation = requestAnimationFrame(scanQrTick);
        })
        .catch(err => {
          alert('카메라 접근 권한이 필요합니다.');
          closeQrScannerModal();
        });
    }

    function scanQrTick() {
      const video = document.getElementById('qrVideo');
      const canvas = document.getElementById('qrCanvas');
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: 'dontInvert'
        });

        if (code) {
          try {
            const url = new URL(code.data);
            const team = url.searchParams.get('team');
            if (team) {
              closeQrScannerModal();
              loginTeam(team);
              return;
            }
          } catch (e) {
            if (code.data.includes('모둠')) {
              closeQrScannerModal();
              loginTeam(code.data);
              return;
            }
          }
        }
      }
      qrScanAnimation = requestAnimationFrame(scanQrTick);
    }

    function closeQrScannerModal() {
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
      }
      cancelAnimationFrame(qrScanAnimation);
      document.getElementById('qrScannerModal').classList.add('hidden');
    }

        item.innerHTML = `
          <div>
            <h4 class="font-bold text-sm text-slate-800">${t}</h4>
            <p class="text-[10px] text-slate-400 max-w-[200px] truncate">${teamUrl}</p>
          </div>
          <div id="${qrContainerId}" class="p-1 bg-white rounded border"></div>
        `;
        list.appendChild(item);

        new QRCode(document.getElementById(qrContainerId), {
          text: teamUrl,
          width: 72,
          height: 72
        });
      });
    }

    // 최종 보고서 모달
    function showFinalReport() {
      saveCurrentStep();
      const modal = document.getElementById('reportModal');
      const body = document.getElementById('reportBody');
      const teamData = (missionStore[currentTeam]) || {};

      document.getElementById('reportTitle').innerText = `[${currentTeam}] 덕수궁 탐구 최종 답안`;
      let html = `<div class="p-3 bg-slate-100 rounded-xl space-y-1 mb-3">
        <p class="font-bold text-slate-800">${currentTeam} 현장 탐구 보고서</p>
        <p class="text-slate-500 text-[11px]">작성일시: ${new Date().toLocaleString('ko-KR')}</p>
      </div>`;

      MISSIONS.forEach(m => {
        const ansObj = teamData[m.id]?.answers || {};
        const entries = Object.entries(ansObj);
        html += `<div class="p-2.5 border rounded-lg space-y-1 bg-white">
          <div class="font-bold text-teal-800">${m.title}</div>`;
        if (entries.length === 0) {
          html += `<div class="text-slate-400 italic">미입력</div>`;
        } else {
          entries.forEach(([k, v]) => {
            html += `<div class="text-slate-700 pl-1">• ${k.replace('ans_', '')}: <strong>${v || '미입력'}</strong></div>`;
          });
        }
        html += `</div>`;
      });

      body.innerHTML = html;
      modal.classList.remove('hidden');
    }

    function copyReportText() {
      const teamData = (missionStore[currentTeam]) || {};
      let txt = `[덕수궁 매쓰 투어 보고서 - ${currentTeam}]\n`;
      MISSIONS.forEach(m => {
        txt += `\n${m.title}\n`;
        const ansObj = teamData[m.id]?.answers || {};
        const entries = Object.entries(ansObj);
        if (entries.length === 0) txt += `(미입력)\n`;
        else {
          entries.forEach(([k, v]) => {
            txt += `- ${k.replace('ans_', '')}: ${v || '미입력'}\n`;
          });
        }
      });

      navigator.clipboard.writeText(txt).then(() => {
        alert('보고서 텍스트가 클립보드에 복사되었습니다! 카카오톡이나 패들렛에 바로 붙여넣기 하세요.');
      });
    }
  </script>
</body>
</html>
